<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Limitless proposal</title><style>
*{box-sizing:border-box}body{margin:0;background:#120f0e;color:#f4ede3;font:17px/1.75 Arial,sans-serif}main{--accent:#e6c17d;max-width:1120px;margin:auto;padding:42px 6vw 70px}header{display:flex;justify-content:space-between;gap:24px;border-bottom:1px solid #ffffff30;padding-bottom:24px;font-size:12px;letter-spacing:.15em;text-transform:uppercase}.hero{padding:84px 0 64px}.eyebrow{color:var(--accent);font:italic 22px Georgia,serif}h1{font:normal clamp(46px,8vw,100px)/1.02 Georgia,serif;letter-spacing:-.04em;max-width:950px;margin:24px 0}h2{font:normal 34px/1.15 Georgia,serif;margin:0 0 22px}p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}h1,h2{overflow-wrap:anywhere}.intro{font-size:22px;max-width:780px;color:#d6cfc8}.facts{display:flex;flex-wrap:wrap;gap:14px 44px;margin-top:38px;color:var(--accent)}.sections{display:grid;grid-template-columns:1fr 1fr;gap:26px}.section{padding:34px;border:1px solid #ffffff25;border-radius:3px}.section .number{display:block;color:var(--accent);font-size:12px;letter-spacing:.2em;margin-bottom:18px}.investment{padding:42px 0;margin-top:48px;border-top:1px solid var(--accent)}.amount{font:normal clamp(32px,5vw,56px)/1.2 Georgia,serif;color:var(--accent);margin-bottom:24px}.terms{font-size:14px;opacity:.8}footer{margin-top:48px;padding-top:24px;border-top:1px solid #ffffff30;white-space:pre-wrap}body:has(.minimal){background:#f8f7f3;color:#222}.minimal{--accent:#50664e}.minimal header,.minimal .section,.minimal footer{border-color:#2223}.minimal h1,.minimal h2{font-family:Arial,sans-serif;letter-spacing:-.05em}.minimal .intro{color:#555}.minimal .section{border-width:1px 0 0;padding:26px 0}.minimal .sections{gap:48px}body:has(.bold){background:#2421d4;color:#fff}.bold{--accent:#efff7b}.bold h1{font-family:Arial,sans-serif;font-weight:900;text-transform:uppercase}.bold .section{background:#ffffff0c;border-radius:18px}.bold .intro{color:#fff}.bold .investment{background:var(--accent);color:#17164c;padding:36px;border-radius:18px}.bold .amount{color:#17164c}body:has(.technical){background:#edf2f5;color:#142c3d}.technical{--accent:#006579}.technical h1,.technical h2{font-family:monospace;letter-spacing:-.05em}.technical header,.technical .section,.technical footer{border-color:#142c3d40}.technical .section{background:#fff}.technical .intro{color:#334f60}.technical .facts{font-family:monospace}.technical .sections{grid-template-columns:1fr}.technical .section{display:grid;grid-template-columns:45px 210px 1fr;gap:20px}.technical h2{font-size:24px}@media(max-width:650px){main{padding:24px}.hero{padding:46px 0}.sections{grid-template-columns:1fr}.section{padding:24px}header{font-size:10px}.technical .section{display:block}.intro{font-size:18px}h2{font-size:29px}}@media print{body{background:white!important;color:#111!important}.section{break-inside:avoid}main{padding:0}.hero{padding:24px 0}.intro,.amount,.facts,.eyebrow{color:#222!important}}
</style></head><body><p id="status" role="status">Loading proposal…</p><script>const render=function renderBody(p) {
    const esc = (s) => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const sections = [['The experience', p.experience], ['Production scope', p.scope], ['Delivery & collaboration', p.delivery], ['Next steps', p.nextSteps]].filter(([, body]) => body.trim());
    return `<main class="${esc(p.style)}"><header><span>Limitless Lights + Sound</span><span>Prepared for ${esc(p.client)}</span></header><div class="hero"><span class="eyebrow">Your event. Thoughtfully produced.</span><h1>${esc(p.title)}</h1><p class="intro">${esc(p.summary)}</p><div class="facts"><span>${esc(p.eventDate)}</span><span>${esc(p.venue)}</span></div></div><div class="sections">${sections.map(([heading, body], i) => `<section class="section"><span class="number">0${i + 1}</span><h2>${heading}</h2><p>${esc(body)}</p></section>`).join('')}</div><section class="investment"><h2>Your investment</h2><p class="amount">${esc(p.investment)}</p><p class="terms">${esc(p.terms)}</p></section><footer>${esc(p.contact)}</footer></main>`;
};fetch('./proposal.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{document.title=data.content.title+' | Limitless';document.body.innerHTML=render(data.content)}).catch(()=>{document.getElementById('status').textContent='This proposal is temporarily unavailable. Please try again.'});</script></body></html>
